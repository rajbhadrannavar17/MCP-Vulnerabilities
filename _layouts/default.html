<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">PortSwigger MCP Labs</a>
  </header>
  <main class="page-content">
    {% if page.url contains '/labs/' %}
    <a class="back-link" href="{{ '/' | relative_url }}">← All writeups</a>
    <article class="article-content">{{ content }}</article>
    {% else %}
    {{ content }}
    {% endif %}
  </main>
</body>
</html>
