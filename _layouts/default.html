<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">MCP<span> / </span>LABS</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">All labs</a>
      <a href="https://github.com/rajbhadrannavar17/MCP-Vulnerabilities/tree/main/writeups/mcp">Source writeups</a>
    </nav>
  </header>
  <main class="page-content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <span>Independent lab notes · For authorized practice environments</span>
    <a href="https://github.com/rajbhadrannavar17/MCP-Vulnerabilities">View repository</a>
  </footer>
</body>
</html>
